<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Pre-Arrival Triage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏥 ThusoMed Assistant</h1>
      <div class="subtitle">Are you in an Emergency?? Don't panic Thuso is here</div>
    </header>
    <section class="facility-choice">
      <div class="facility-label">Please choose your facility type:</div>
      <div class="facility-buttons">
        <button class="facility-btn" onclick="chooseFacility('Clinic')">Clinic</button>
        <button class="facility-btn" onclick="chooseFacility('Hospital')">Hospital</button>
      </div>
    </section>
  </div>

  <script>
    function chooseFacility(type) {
      alert("You selected: " + type);
      // window.location.href = type.toLowerCase() + ".html";
    }
  </script>
</body>
</html>
